# Source-repository command allowlist. Deployment verbs belong in deploy.
commands:
  install:
    run: make install
    description: Install the pinned dependencies.
  test:
    run: make test
    description: Build TypeScript and run the unit and inventory tests.
  lint:
    run: make lint
    description: Lint TypeScript source and tests.
  typecheck:
    run: make typecheck
    description: Type-check TypeScript source and tests.
  audit:
    run: make audit
    description: Audit production dependencies for high-severity vulnerabilities.
  precommit:
    run: make precommit
    description: Run every repository pre-commit hook.
  build-docker:
    run: make build-docker
    description: Build the non-root bluesky-mcp image locally.
  image-publish-check:
    run: bash -n scripts/publish-image.sh
    description: Parse the trusted Forgejo OCI publisher shell contract.
  run:
    run: make run
    description: Run the streamable HTTP MCP locally.

catalog:
  kind: Component
  type: service
  system: infrastructure
  owner: kai
  lifecycle: production
  description: "Authenticated, strictly read-only Bluesky MCP with a fixed 11-tool inventory."
  dependsOn: []
  providesApis:
    - bluesky-mcp
