name: build-publish

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.255.0
    steps:
      - uses: actions/checkout@v4
      - run: ward install
      - run: ward lint
      - run: ward typecheck
      - run: ward test
      - run: ward audit
  publish:
    needs: validate
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.255.0
    steps:
      - uses: actions/checkout@v4
      - name: Resolve docker host
        run: |
          set -euo pipefail
          gw=$(node -e "const fs=require('fs');const l=(fs.readFileSync('/proc/net/route','utf8').split('\\n').find(x=>x.split('\\t')[1]==='00000000'))||'';const h=l.split(/\\s+/)[2]||'';if(h){console.log(h.match(/../g).reverse().map(x=>parseInt(x,16)).join('.'))}" || true)
          for h in "tcp://${gw}:2375" "${DOCKER_HOST:-}" tcp://localhost:2375 unix:///var/run/docker.sock; do
            [ -z "$h" ] || [ "$h" = "tcp://:2375" ] && continue
            if docker -H "$h" info >/dev/null 2>&1; then echo "DOCKER_HOST=$h" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "no reachable docker daemon" >&2; exit 1
      - name: Build and publish immutable image
        run: |
          set -euo pipefail
          image=192.168.0.194:30500/bluesky-mcp:${{ github.sha }}
          docker build --pull --tag "$image" .
          docker push "$image"
